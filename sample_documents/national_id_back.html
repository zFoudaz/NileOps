<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بطاقة الرقم القومي - الظهر</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=OCR-B&family=Courier+Prime:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .id-card {
      width: 950px;
      height: 590px;
      background: linear-gradient(135deg, #e4edf5 0%, #d8e8f2 35%, #ebf3f8 70%, #d2e4f0 100%);
      border: 2px solid #b2c9d9;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      padding: 28px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .id-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 30% 70%, rgba(200, 225, 240, 0.6) 0%, transparent 60%),
        repeating-linear-gradient(45deg, rgba(180, 210, 230, 0.15) 0, rgba(180, 210, 230, 0.15) 2px, transparent 2px, transparent 10px);
      pointer-events: none;
      z-index: 1;
    }

    .eagle-watermark {
      position: absolute;
      top: 40%;
      left: 30%;
      transform: translate(-50%, -50%);
      width: 340px;
      height: 340px;
      opacity: 0.1;
      pointer-events: none;
      z-index: 2;
    }

    /* Top Grid Information */
    .top-section {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      gap: 30px;
      border-bottom: 2px solid rgba(30, 60, 90, 0.15);
      padding-bottom: 15px;
    }

    .left-box {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .right-box {
      flex: 0.8;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-right: 2px dashed rgba(30, 60, 90, 0.2);
      padding-right: 25px;
    }

    .info-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .label {
      font-size: 16px;
      font-weight: 700;
      color: #334155;
      min-width: 95px;
    }

    .val {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
    }

    .highlight-expiry {
      background: rgba(239, 68, 68, 0.08);
      border: 1.5px solid #ef4444;
      padding: 6px 14px;
      border-radius: 10px;
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
    }

    .highlight-expiry .val {
      color: #b91c1c;
      font-family: 'Cairo', monospace;
      letter-spacing: 1px;
    }

    /* Middle Strip: Barcode / Chips */
    .middle-strip {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 20px;
      margin: 10px 0;
    }

    .barcode-lines {
      height: 42px;
      width: 450px;
      background: repeating-linear-gradient(
        90deg,
        #0f172a 0px,
        #0f172a 2px,
        transparent 2px,
        transparent 5px,
        #0f172a 5px,
        #0f172a 8px,
        transparent 8px,
        transparent 10px,
        #0f172a 10px,
        #0f172a 11px,
        transparent 11px,
        transparent 14px
      );
    }

    .card-meta {
      font-size: 14px;
      font-weight: 700;
      color: #475569;
    }

    /* MRZ Code at bottom */
    .mrz-section {
      position: relative;
      z-index: 5;
      background: #0f172a;
      border-radius: 12px;
      padding: 14px 25px;
      direction: ltr;
      text-align: left;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .mrz-line {
      font-family: 'Courier Prime', 'OCR-B', monospace;
      font-size: 23px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 4px;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div class="id-card">
    <svg class="eagle-watermark" viewBox="0 0 100 100" fill="#1e3a8a">
      <path d="M50 10 C45 25 35 30 20 35 C30 45 35 60 30 85 C42 75 48 65 50 55 C52 65 58 75 70 85 C65 60 70 45 80 35 C65 30 55 25 50 10 Z"/>
    </svg>

    <!-- Top Grid -->
    <div class="top-section">
      <div class="left-box">
        <div class="info-row">
          <span class="label">المهنة:</span>
          <span class="val">مهندس برمجيات</span>
        </div>
        <div class="info-row">
          <span class="label">جهة العمل:</span>
          <span class="val">شركة النيل لتكنولوجيا المعلومات</span>
        </div>
        <div class="info-row">
          <span class="label">الحالة الاجتماعية:</span>
          <span class="val">أعزب</span>
        </div>
      </div>

      <div class="right-box">
        <div class="info-row">
          <span class="label">النوع:</span>
          <span class="val">ذكر</span>
        </div>
        <div class="info-row">
          <span class="label">الديانة:</span>
          <span class="val">مسلم</span>
        </div>
        <div class="info-row highlight-expiry">
          <span class="label" style="color: #b91c1c;">تاريخ الانتهاء:</span>
          <span class="val">2031/10/14</span>
        </div>
      </div>
    </div>

    <!-- Middle Barcode -->
    <div class="middle-strip">
      <div class="barcode-lines"></div>
      <div class="card-meta">
        تاريخ الإصدار: 2024/10/15
      </div>
    </div>

    <!-- MRZ OCR Box -->
    <div class="mrz-section">
      <div class="mrz-line">ID&lt;EGY29810150101235&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</div>
      <div class="mrz-line">9810158M3110145EGY&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;8</div>
      <div class="mrz-line">ALI&lt;&lt;AHMED&lt;MOHAMED&lt;MAHMOUD&lt;&lt;&lt;&lt;&lt;</div>
    </div>
  </div>

</body>
</html>
